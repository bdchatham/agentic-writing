# Vale configuration for agentic-writing.
# Reference: https://vale.sh/docs/keys/

StylesPath = styles

# Third-party packages. Run `vale sync` after any change here.
Packages = write-good, proselint

MinAlertLevel = suggestion

Vocab = AgenticWriting

[*.md]
BasedOnStyles = Vale, AgenticWriting, write-good

# write-good overlaps with the STE rules below. Keep one owner per concern.
write-good.Passive = NO
write-good.TooWordy = NO

# The ADR section rules describe an ADR, not prose in general. A README has no
# '## Decision' heading and that is not a defect. See [docs/adr/*.md] below.
AgenticWriting.ADR-Status = NO
AgenticWriting.ADR-Context = NO
AgenticWriting.ADR-Decision = NO
AgenticWriting.ADR-Consequences = NO

# The 20-word limit is the procedure limit. Ordinary prose uses the 25-word
# description limit, so this rule stays off outside docs/procedures. The rule
# file already says so; without this line it ran on every Markdown file and
# reported a second finding on every sentence the description rule caught.
AgenticWriting.STE-SentenceLength-Procedure = NO

# Normative documents carry a stricter contract: RFC 2119 keywords must be
# uppercase, because lowercase "must" is ordinary prose and carries no obligation.
[specs/**/*.md]
BasedOnStyles = Vale, AgenticWriting
AgenticWriting.RFC2119-Keywords = error

# Procedures use the tighter sentence limit. See anchors/asd-ste100.md.
[docs/procedures/**/*.md]
AgenticWriting.STE-SentenceLength-Procedure = YES
AgenticWriting.STE-SentenceLength-Description = NO

# ADR (Nygard): all four sections are mandatory in an ADR.
[docs/adr/*.md]
AgenticWriting.ADR-Status = YES
AgenticWriting.ADR-Context = YES
AgenticWriting.ADR-Decision = YES
AgenticWriting.ADR-Consequences = YES
