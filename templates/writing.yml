# Installed by agentic-writing. This calls a reusable workflow rather than
# copying one, so a fix to the check reaches this repository when you raise the
# pin below, instead of needing a pull request here.
#
# The pin is a real action ref, so Dependabot raises it like any other.
name: writing

on:
  pull_request:
  push:
    branches: [main]

# No paths: filter on purpose. A required check that gets skipped stays pending
# forever on a pull request that touches no Markdown.

jobs:
  writing:
    uses: bdchatham/agentic-writing/.github/workflows/writing-contract.yml@@REF@
    permissions:
      contents: read
      pull-requests: write
