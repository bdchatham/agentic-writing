name: writing-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint prose against the writing contract
        uses: vale-cli/vale-action@reviewdog
        with:
          reporter: github-pr-review
          fail_level: error
          # Comment on warnings and errors, not suggestions. fail_level governs
          # what blocks; this governs what is worth an inline comment.
          #
          # This setting was first made for the wrong reason. STE-NounCluster
          # fired on every well-formed EARS criterion, 12 of the 25 comments on
          # one pull request were that one interaction, and raising the level
          # hid the reports rather than the cause. The rule is fixed: an
          # uppercase keyword is no longer a noun to it. The setting stands on
          # its own ground now — a suggestion informs a local run, and a diff
          # is not the place to argue one.
          level: warning
          files: '["README.md", "docs", "anchors", "specs", ".specify/memory"]'

  rule-regression:
    # A rule that stops firing is a silent failure. Fixtures catch it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.17.1 is a floor, not a preference. On 3.14.0 a `sequence` whose tokens
      # are all `tag:` entries matches nothing, which silently disabled
      # STE-NounCluster while every other rule kept working. Verified by running
      # both versions against evals/fixtures/ste-violations.md.
      - name: Install Vale
        run: |
          VALE_VERSION=3.17.1
          curl -sfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale --version

      # .vale.ini declares Packages, and those are not committed. Without this
      # step every rule fails to load and the failure reads as a broken fixture.
      - name: Fetch the third-party style packages
        run: vale sync

      - name: Confirm the styles load
        run: vale ls-config

      - name: Run fixture expectations
        run: ./evals/run.sh

      # Per-rule golden files. Each rule is isolated by its own config, so a
      # failure names one rule, and the golden pins line, column and message.
      - name: Run per-rule golden fixtures
        run: ./evals/rules/run.sh

  registry-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The admission gate compares anchors/grandfathered.txt against main to
      # hold the list monotonic. A shallow clone has no main to compare with,
      # and the gate says so rather than passing on one arm.
      # Two lists are held monotonic against main: anchors/grandfathered.txt and
      # anchors/unregistered.txt. A shallow clone has no main to compare with, and
      # each gate says so rather than passing on one arm.
      - name: Fetch main for the monotonicity comparisons
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      - name: No artifact cites a private skill or agent as an authority
        run: ./scripts/check-no-private-citations.sh

      # `specify init` rewrites .specify/templates from the CLI's bundled
      # assets, which would silently revert the spec template's deltas.
      - name: Spec template still carries its deltas
        run: ./scripts/check-template-deltas.sh

      # The coverage manifest says what each anchor actually checks. A claim
      # nobody verifies is how arc42 came to credit rules that check something
      # else, so the manifest is enforced rather than trusted.
      - name: Coverage manifest is true
        run: ./scripts/check-coverage.sh

      # An anchor arrives with four artifacts or it does not arrive. The
      # anchors that predate the rule are marked grandfathered and counted.
      - name: Every admitted anchor carries its four artifacts
        run: ./scripts/check-admission.sh

      # A structure rule left unscoped for consumers runs on every Markdown
      # file they have. Three rules had already drifted between the two
      # configurations before this gate existed.
      - name: The consumer configuration scopes the same rules
        run: ./scripts/check-consumer-scoping.sh

      # Three of the seven success criteria named a verifier nobody had built. A
      # criterion citing a check that does not run reads exactly like one that passes.
      - name: Every success criterion names a verifier that runs
        run: ./scripts/check-verifiers.sh

      # SC-002 in the other direction: the registry consistency job never read the
      # contract, so twelve anchors the contract names had no entry at all.
      - name: Every anchor the contract names resolves, or is recorded debt
        run: ./scripts/check-contract-anchors.sh

      # SC-005 and SC-006.
      - name: Every artifact is inside its length limit
        run: ./scripts/check-artifact-length.sh

      # The eighteen section rules are generated from scripts/modes.yaml. A hand
      # edit is worse than a hand-written rule: the next generator run reverts it.
      - name: The generated section rules match their manifest
        run: ./scripts/check-generated-rules.sh

      - name: Every registry rule reference resolves to a rule file
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          reg = yaml.safe_load(open('anchors/registry.yaml'))
          have = {p.stem for p in pathlib.Path('styles/AgenticWriting').glob('*.yml')}
          bad = []
          for a in reg['anchors']:
              for r in (a['verifier'].get('rules') or []):
                  stem = r.split('.', 1)[1]
                  if stem not in have:
                      bad.append((a['id'], r))
          for anchor, rule in bad:
              print(f"dangling reference: {anchor} -> {rule}")
          sys.exit(1 if bad else 0)
          PY

      - name: Generated files are in sync with the registry
        run: |
          python3 scripts/render-context.py --target agents > /tmp/AGENTS.md
          diff -q /tmp/AGENTS.md AGENTS.md || {
            echo "AGENTS.md is stale. Run scripts/render-context.py."; exit 1; }
