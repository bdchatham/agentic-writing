# GitHub Spec Kit spec-template.md: Success Criteria is mandatory.
# Presence only. Vale cannot judge whether the section says anything.
# Scoped in .vale.ini; without that scope this fires on every file.
extends: occurrence
message: "Spec is missing '## Success Criteria'. A spec without measurable outcomes cannot be closed."
level: error
scope: raw
ignorecase: true
min: 1
token: '(?m)^## +Success Criteria\b'
