# A house section, not an arc42 one -- arc42 defines no Non-goals section. The
# arc42 anchor is verified by Design-Arc42Order and by nothing else.
# Presence only. Vale cannot judge whether the section says anything.
# Scoped in .vale.ini; without that scope this fires on every file.
extends: occurrence
message: "Design is missing '## Non-goals'. A scope with no stated boundary grows while the document is open."
level: error
scope: raw
ignorecase: true
min: 1
token: '(?m)^## +Non-goals\b'
